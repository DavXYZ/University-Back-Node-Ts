version: '3.8'

services:
  app:
    build: .
    container_name: node_app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${DB_PASSWORD}
      - PG_DATABASE=${DB_DATABASE}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_REFRESH_EXPIRATION_SHORT=${JWT_REFRESH_EXPIRATION_SHORT}
      - JWT_REFRESH_EXPIRATION_LONG=${JWT_REFRESH_EXPIRATION_LONG}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - CLIENT_URL=${CLIENT_URL}
      - API_URL=${API_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - COOKIE_KEY1=${COOKIE_KEY1}
      - COOKIE_KEY2=${COOKIE_KEY2}
      - HUNTER_IO_API=${HUNTER_IO_API}
      - TRANSLATION_SERVICE=${TRANSLATION_SERVICE}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY}
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - AZURE_TRANSLATOR_KEY=${AZURE_TRANSLATOR_KEY}
      - AZURE_TRANSLATOR_REGION=${AZURE_TRANSLATOR_REGION}
      - REDIS_URL=${REDIS_URL}
    volumes:
      - .:/usr/src/app
    depends_on:
      - redis
      - postgres
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]  # Example health check for the app
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"  # Redis port
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"  # PostgreSQL port
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 10s

volumes:
  redis-data:
  postgres-data:

networks:
  backend:
    driver: bridge
